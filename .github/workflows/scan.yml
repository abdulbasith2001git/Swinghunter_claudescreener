# SWING HUNTER v8 — GitHub Actions Workflow
# 2 scans daily: 8 PM IST evening + 9:30 AM IST morning
#
# SETUP:
# 1. github.com → New private repo
# 2. Upload swing_hunter.py + this file to .github/workflows/scan.yml
# 3. Settings → Secrets → Actions → Add:
#    TELEGRAM_TOKEN   = your bot token
#    TELEGRAM_CHAT_ID = your chat ID

name: Swing Hunter Scans

on:
  schedule:
    # IST = UTC + 5:30
    # 8:00 PM IST  = 14:30 UTC  → EVENING SCAN
    # 9:30 AM IST  = 04:00 UTC  → MORNING SCAN (next day)
    - cron: '30 14 * * 1-5'   # Evening scan  8:00 PM IST Mon-Fri
    - cron: '00 4  * * 2-6'   # Morning scan  9:30 AM IST Tue-Sat

  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Which scan?'
        required: true
        default: 'evening'
        type: choice
        options: [evening, morning, test, telegram]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install yfinance pandas requests schedule

      # Use date-based cache so evening + morning share same shortlist
      - name: Get cache date key
        run: |
          # Morning scan belongs to PREVIOUS day's evening scan
          # So morning scan at 9:30 AM uses yesterday's date as key
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt "10" ]; then
            # Morning scan — use yesterday's date to match evening cache
            echo "CACHE_DATE=$(date -u -d 'yesterday' +%Y-%m-%d)" >> $GITHUB_ENV
          else
            echo "CACHE_DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV
          fi
          echo "Cache date: $CACHE_DATE"

      - name: Restore daily cache
        uses: actions/cache@v4
        with:
          path: |
            shortlist.json
            fundamentals_cache.json
            stocks_cache.json
            active_trades.json
          key: swing-${{ env.CACHE_DATE }}
          restore-keys: swing-

      - name: Detect scan type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SCAN_TYPE=${{ github.event.inputs.scan_type }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge "14" ] && [ "$HOUR" -le "15" ]; then
              echo "SCAN_TYPE=evening" >> $GITHUB_ENV
            elif [ "$HOUR" -ge "3" ] && [ "$HOUR" -le "5" ]; then
              echo "SCAN_TYPE=morning" >> $GITHUB_ENV
            else
              # Fallback — detect by time
              if [ "$HOUR" -lt "10" ]; then
                echo "SCAN_TYPE=morning" >> $GITHUB_ENV
              else
                echo "SCAN_TYPE=evening" >> $GITHUB_ENV
              fi
            fi
          fi
          echo "Will run: $SCAN_TYPE scan"

      - name: Run scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== $SCAN_TYPE scan started at $(date) UTC ==="
          python swing_hunter.py $SCAN_TYPE
          echo "=== Completed at $(date) UTC ==="
        timeout-minutes: 80

      - name: Save daily cache
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            shortlist.json
            fundamentals_cache.json
            stocks_cache.json
            active_trades.json
          key: swing-${{ env.CACHE_DATE }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCAN_TYPE }}-${{ github.run_number }}
          path: |
            *.log
            scan_*.json
            shortlist.json
          retention-days: 14
          if-no-files-found: ignore
